name: Release Klip

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [[ -z "$latest_tag" ]]; then
            next_tag="v0.0.1"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            commit_subject=$(git log -1 --pretty=%s "$GITHUB_SHA")
            case "$commit_subject" in
              feat:*)
                next_tag="v${major}.$((minor + 1)).0"
                ;;
              *)
                next_tag="v${major}.${minor}.$((patch + 1))"
                ;;
            esac
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Release $next_tag"
          git push origin "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Build Klip.app
        run: ./Scripts/package-app.sh

      - name: Create user download
        run: ditto -c -k --sequesterRsrc --keepParent dist/Klip.app Klip-macOS.zip

      - name: Attach executable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: Klip-macOS.zip
