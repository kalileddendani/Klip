name: Release Klip

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'fix:') || startsWith(github.event.head_commit.message, 'feat:')
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create next release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          commit_subject=$(git log -1 --pretty=%s "$GITHUB_SHA")
          if [[ -z "$latest_tag" ]]; then
            case "$commit_subject" in
              feat:*) next_tag="v0.1.0" ;;
              fix:*) next_tag="v0.0.1" ;;
              *)
                echo "Unsupported release commit type: $commit_subject"
                exit 1
                ;;
            esac
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$version"
            case "$commit_subject" in
              feat:*)
                next_tag="v${major}.$((minor + 1)).0"
                ;;
              fix:*)
                next_tag="v${major}.${minor}.$((patch + 1))"
                ;;
              *)
                echo "Unsupported release commit type: $commit_subject"
                exit 1
                ;;
            esac
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next_tag" -m "Release $next_tag"
          git push origin "$next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Build installer disk image
        run: ./Scripts/create-dmg.sh
        env:
          VERSION: ${{ steps.release.outputs.tag }}

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: dist/Klip.dmg
