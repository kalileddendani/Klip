name: Release Klip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Klip.app
        run: ./Scripts/package-app.sh

      - name: Create user download
        run: ditto -c -k --sequesterRsrc --keepParent dist/Klip.app Klip-macOS.zip

      - name: Attach executable to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Klip-macOS.zip
